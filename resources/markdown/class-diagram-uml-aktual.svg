<line class="rule" x1="60" y1="1930" x2="2940" y2="1930"/><text class="note" x="60" y="1960">Label [Controller::action] adalah operasi sistem yang dipetakan ke controller/route; label [Eloquent] adalah method relasi yang benar-benar didefinisikan pada model.</text><text class="note" x="60" y="1988">FK id() dan foreignId() Laravel adalah unsigned BIGINT. VARCHAR tanpa panjang khusus adalah VARCHAR(255); [nullable] dan [unique] mengikuti migration.</text><text class="note" x="60" y="2016">created_at/updated_at adalah TIMESTAMP nullable dari timestamps() dan dihilangkan dari kotak. Token mentah tidak disimpan; kolom token adalah hash SHA-256 VARCHAR(64), nullable dan unique.</text><text class="note" x="60" y="2044">Feedback.transaction_id wajib dan unique. User.role adalah ENUM admin/superadmin; status transaksi adalah VARCHAR dengan nilai Belum dilayani, Sedang dilayani, Sudah dilayani.</text><text class="note" x="60" y="2072">Route master data berada dalam grup auth. Route akun memakai auth + SuperAdminMiddleware; route unduh bukti menambah AdminMiddleware. Route feedback/status publik memakai throttle sesuai definisi aktif.</text></svg>

